<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A pet project for syncing CCTV recordings with Google Drive.">
  <title>CCTV Sync</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(680px, calc(100% - 32px)); padding: 48px; background: white; border: 1px solid #e3e8f0; border-radius: 20px; box-shadow: 0 16px 48px #17203312; }
    .label { color: #58677f; font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2.2rem, 8vw, 3.5rem); letter-spacing: -.04em; }
    p { color: #46546b; font-size: 1.1rem; line-height: 1.7; }
    a { color: #155eef; font-weight: 650; }
    footer { margin-top: 32px; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="label">Personal project</div>
    <h1>CCTV Sync</h1>
    <p>A pet project exploring how to sync CCTV recordings with Google Drive.</p>
    <p>This project is a work in progress. Visit the <a href="https://github.com/Datadevourer/cctv-sync">GitHub repository</a> for source code and updates.</p>
    <footer>Built with GitHub Pages.</footer>
  </main>
</body>
</html>
